[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negarit-ai-engine"
version = "0.1.0"
description = "Negarit AI detection engine: phishing, URL, OCR, image and risk scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
packages = [
    "shared",
    "phishing_detection",
    "url_detection",
    "risk_engine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"